name: attendance
description: Class attendance with rotating / static QR codes and location checks.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  mobile_scanner: ^6.0.2
  geolocator: ^13.0.1
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.3
  intl: ^0.19.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
